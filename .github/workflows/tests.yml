name: Tests

on:
  push:
  pull_request:

jobs:
  ledger-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run ledger tests
        run: npm test
